name: Repository checks

# Everything here runs against the checked-out branch only. Nothing touches
# the production domain, so nothing here can race a deployment.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Registry validation, publication-state gates, prohibited content,
      # link resolution, video controls.
      - name: Preflight
        run: python3 tools/preflight.py

      # If the committed HTML differs from what the records now produce, the
      # repository has drifted and the deployed site would not match it.
      # build-info.json carries a build timestamp, so it is generated at deploy
      # time and gitignored rather than committed — the comparison below stays
      # deterministic because that file is never in the working tree's index.
      - name: Committed output matches the registry
        run: |
          if ! git diff --exit-code -- '*.html' 'sitemap.xml' 'robots.txt'; then
            echo
            echo "Generated pages differ from what is committed."
            echo "Run: python3 build.py && git add -A && git commit"
            exit 1
          fi
